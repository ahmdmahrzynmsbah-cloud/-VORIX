<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#800020" />
      <stop offset="50%" stop-color="#550015" />
      <stop offset="100%" stop-color="#2B000B" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#F3E6D5" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <linearGradient id="vGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F3E6D5" />
      <stop offset="100%" stop-color="#C5A059" />
    </linearGradient>
    <linearGradient id="vGradRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="60%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- App Icon Base Card -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Automotive Precision Gear Rim (Background) -->
  <g opacity="0.35" transform="translate(256, 210)">
    <circle r="120" fill="none" stroke="url(#metalGrad)" stroke-width="12" stroke-dasharray="24 16" />
    <circle r="90" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="8 8" />
  </g>

  <!-- Central Dynamic "V" & Mechanical Wings (VORIX Symbol) -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Left Wing of V -->
    <path d="M 130 110 L 210 110 L 256 275 L 210 275 Z" fill="url(#vGradLeft)" />
    
    <!-- Right Wing of V -->
    <path d="M 382 110 L 302 110 L 256 275 L 302 275 Z" fill="url(#vGradRight)" />

    <!-- Center Precision Shield & Diamond Apex -->
    <polygon points="256,150 290,210 256,330 222,210" fill="url(#metalGrad)" />
    
    <!-- Mechanical Chevron Accents -->
    <path d="M 170 170 L 256 310 L 342 170" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    
    <!-- Spark / Precision Dot -->
    <circle cx="256" cy="180" r="10" fill="#FFFFFF" />
  </g>

  <!-- Typography: VORIX -->
  <g transform="translate(256, 395)">
    <text x="0" y="0" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" letter-spacing="8" fill="#FFFFFF">VORIX</text>
  </g>

  <!-- Sub-label: AUTO SPARE PARTS -->
  <g transform="translate(256, 435)">
    <text x="0" y="0" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" letter-spacing="4" fill="#F3E6D5" opacity="0.85">AUTO SPARE PARTS</text>
  </g>
</svg>
